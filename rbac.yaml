# Maps Keycloak roles to the Elasticsearch index patterns they may read (read + view_index_metadata).
# A caller's access is the union of the patterns for all of their roles; roles not listed here grant nothing.
# Every pattern here must also be readable by the ES broker user, since a minted key can never exceed it.
roles:
  soc-analyst:
    indices:
      - ecs-microsoft-windows-*
      - ecs-nginx-*
      - ecs-fortinet-*
  helpdesk:
    indices:
      - ecs-microsoft-windows-*
