[project]
name = "elasticsearch-fastmcp-server"
version = "0.2.1"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "elasticsearch>=9.5.0",
    "fastmcp[apps]>=4.0.3",
    "mcp[cli]>=2.1.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
