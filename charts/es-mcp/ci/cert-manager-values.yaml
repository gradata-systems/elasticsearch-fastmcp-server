# Rendered in CI: cert-manager certificate, overridden policy, packs from values and existing
# ConfigMaps, several replicas.
publicBaseUrl: https://es-mcp.example.com
elasticsearch:
  url: https://es.example.svc:9200
  impersonator: {password: not-a-real-password}
oidc: {issuer: https://idp.example.com}
tls:
  certManager: {enabled: true, issuerRef: {name: internal-ca}}
replicaCount: 2
statelessHttp: true
podDisruptionBudget: {enabled: true}
accessPolicy:
  exposed_indices: [ecs-*]
  impersonable_users: ["*.*"]
packs:
  mini.yaml: {name: mini, title: Mini, description: CI pack, index: "a-*,-a-debug-*"}
packsConfigMaps: [siem-packs, team-packs]
