{{- if not .Values.elasticsearch.impersonator.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "es-mcp.impersonatorSecretName" . }}
  labels:
    {{- include "es-mcp.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ required "elasticsearch.impersonator.password is required without existingSecret" .Values.elasticsearch.impersonator.password | b64enc | quote }}
{{- end }}
