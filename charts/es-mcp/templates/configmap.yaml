{{- if .Values.accessPolicy }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "es-mcp.fullname" . }}
  labels:
    {{- include "es-mcp.labels" . | nindent 4 }}
data:
  access_policy.yaml: |
    {{- toYaml .Values.accessPolicy | nindent 4 }}
{{- end }}
{{- if .Values.packs }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "es-mcp.fullname" . }}-packs
  labels:
    {{- include "es-mcp.labels" . | nindent 4 }}
data:
  {{- range $file, $pack := .Values.packs }}
  {{- if not (hasSuffix ".yaml" $file) }}
  {{- fail (printf "packs key '%s' must be a file name ending in .yaml" $file) }}
  {{- end }}
  {{ $file }}: |
    {{- if kindIs "string" $pack }}
    {{- $pack | nindent 4 }}
    {{- else }}
    {{- toYaml $pack | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
